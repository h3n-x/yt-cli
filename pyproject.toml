[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yt-cli"
dynamic = ["version"]
description = "Descargador multimedia de nivel profesional para YouTube, orientado a Linux."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "YT-CLI Contributors" }]
keywords = ["youtube", "youtube-music", "yt-dlp", "ffmpeg", "downloader", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "yt-dlp>=2025.11.12",  # primera versión con soporte de runtimes JS externos (EJS)
    "mutagen>=1.47",       # carátulas en opus/ogg/flac (EmbedThumbnail de yt-dlp)
    "rich>=13.9",
    "typer>=0.15",
    "pydantic>=2.9",
    "httpx>=0.28",
    "orjson>=3.10",
    "platformdirs>=4.3",
    "tomli-w>=1.1",
]

[project.urls]
Homepage = "https://github.com/h3n-x/yt-cli"
Source = "https://github.com/h3n-x/yt-cli"
Issues = "https://github.com/h3n-x/yt-cli/issues"
Changelog = "https://github.com/h3n-x/yt-cli/blob/main/CHANGELOG.md"

[project.scripts]
yt-cli = "yt_cli.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/yt_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/yt-cli.1",
    "packaging/",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "C90", "S", "BLE"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# yt-dlp no publica tipos; sus valores se tratan como Any en los bordes.
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration' --cov=yt_cli --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "integration: pruebas contra YouTube real (red); deshabilitadas por defecto, usar -m integration",
]
