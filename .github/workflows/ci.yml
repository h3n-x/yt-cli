name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      # Umbral = cobertura real actual (91 %) con margen; subirlo, nunca bajarlo.
      - run: pytest --cov-fail-under=88

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Instalar el wheel en un entorno limpio y probarlo
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/yt-cli --version
          /tmp/smoke/bin/yt-cli --help
          /tmp/smoke/bin/yt-cli config path
      - name: Las completions versionadas coinciden con las generadas
        run: |
          /tmp/smoke/bin/python packaging/generate_completions.py /tmp/completions
          diff -r packaging/completions /tmp/completions

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar el sistema (Arch no admite actualizaciones parciales)
        run: pacman -Syu --noconfirm
      - name: Usuario sin privilegios para makepkg (puede usar pacman vía sudo para -s)
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder:builder .
      - name: makepkg con dependencias y check()
        # makepkg exige que el PKGBUILD esté en el directorio actual.
        run: su builder -c "cd '$PWD/packaging' && makepkg -s --noconfirm -f"
      - name: Instalar el paquete y probarlo
        run: |
          pacman -U --noconfirm packaging/*.pkg.tar.zst
          yt-cli --version
          yt-cli doctor || true
