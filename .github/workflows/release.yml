name: Release

# Publica en PyPI y crea la release de GitHub al empujar un tag vX.Y.Z.
#
# Requisito previo (una sola vez): registrar en PyPI un "Trusted Publisher"
# para el proyecto yt-cli con owner=h3n-x, repo=yt-cli, workflow=release.yml,
# environment=pypi (https://docs.pypi.org/trusted-publishers/). No se usan
# tokens: PyPI confía en la identidad OIDC de este workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: El tag coincide con la versión del paquete
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/yt_cli/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: python -m pip install --upgrade pip build
      - name: Build reproducible
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing + attestations (PEP 740)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Crear la release con los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "Ver CHANGELOG.md"
